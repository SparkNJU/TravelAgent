version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      - AGENT_BASE_URL=http://agent:8000
    depends_on:
      - agent

  agent:
    build: ./agent
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
