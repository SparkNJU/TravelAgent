# Server Configuration
server.port=8080
server.servlet.context-path=/

# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/travel_planning_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.example.backend.service.TripAssistantService=DEBUG

# Application Name
spring.application.name=Travel Planning Backend

# Image Upload Configuration
app.image.upload-dir=./uploads
app.image.base-url=http://localhost:8080/api/community/posts/images/

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Agent bridge configuration
app.agent.base-url=http://localhost:8000/api/trip/plan
app.agent.chat-url=http://localhost:8000/api/agent/chat
app.agent.knowledge-url=http://localhost:8000/api/knowledge/documents
app.agent.knowledge-base-url=http://localhost:8000/api/knowledge
