name: Deploy

on:
  push:
    branches: [ master ]

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy frontend to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: frontend/dist/
          remote_path: /home/admin/myproject/frontend/
          remote_host: 121.41.202.221
          remote_user: admin
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Deploy JAR to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz
          path: backend/target/backend-0.0.1-SNAPSHOT.jar
          remote_path: /home/admin/myproject/backend/
          remote_host: 121.41.202.221
          remote_user: admin
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 121.41.202.221
          username: admin
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/admin/myproject/backend
            JAR_NAME=$(ls -t *.jar 2>/dev/null | head -n 1)
            if [ -z "$JAR_NAME" ]; then
              echo "❌ 未找到 JAR 文件" && exit 1
            fi
            PID=$(ps -ef | grep "java -jar" | grep -v grep | awk '{ print $2 }')
            if [ ! -z "$PID" ]; then
              kill -9 $PID
              echo "已杀掉旧进程 (PID: $PID)"
            fi
            nohup java -jar $JAR_NAME > app.log 2>&1 &
            echo "✅ 后端已启动: $JAR_NAME"

  deploy-agent:
    name: Deploy Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync agent to server (exclude .venv and cache)
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude='.venv' --exclude='__pycache__' --exclude='.env'
          path: agent/
          remote_path: /home/admin/myproject/agent/
          remote_host: 121.41.202.221
          remote_user: admin
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Restart agent service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 121.41.202.221
          username: admin
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            PID=$(ps -ef | grep "uvicorn main:app" | grep -v grep | awk '{ print $2 }')
            if [ ! -z "$PID" ]; then
              kill -9 $PID
              echo "已杀掉旧进程 (PID: $PID)"
            fi
            cd /home/admin/myproject/agent
            nohup /home/admin/myproject/agent/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > agent.log 2>&1 &
            echo "✅ Agent 已启动"
