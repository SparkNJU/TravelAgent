spring:
  datasource:
    # 开发环境：使用内存数据库，每次重启清空
    url: jdbc:h2:mem:tripagent;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    # 如需快速调试，可改为文件数据库并配置:
    # url: jdbc:h2:./data/tripagent-dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

logging:
  level:
    root: debug
    com.tripagent: debug
