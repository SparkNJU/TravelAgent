llm:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key_env: "DASHSCOPE_API_KEY"
  chat_model: "qwen3.6-plus"
  temperature: 0.7
  max_tokens: 4096

agent:
  max_iterations: 16
  self_correction_retries: 2

tools:
  serper:
    enabled: true
    api_key_env: "SERPER_API_KEY"
  file_parser:
    enabled: true
