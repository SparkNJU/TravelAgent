llm:
  base_url: "https://api.deepseek.com/v1"
  api_key_env: "DEEPSEEK_API_KEY"
  chat_model: "deepseek-chat"
  temperature: 0.7
  max_tokens: 4096

agent:
  max_iterations: 16
  self_correction_retries: 2

tools:
  serper:
    enabled: true
    api_key_env: "SERPER_API_KEY"
  file_parser:
    enabled: true
  
backend:
  base_url: "http://localhost:8080"
